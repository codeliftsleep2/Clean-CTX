# cargo-audit configuration
# This file configures the `cargo audit` tool (separate from cargo-deny's deny.toml)

[advisories]
# Ignore specific advisories with documented rationale
ignore = [
    # RUSTSEC-2025-0009: ring 0.17.9 AES overflow panic (debug builds only)
    # Ignored because upgrading ring >=0.17.12 requires cc ^1.2.8, which
    # conflicts with tree-sitter-html 0.20.0 requiring cc ~1.0.83 (ABI-locked).
    # Only affects debug builds with overflow checking enabled; release builds
    # are unaffected. Will resolve when tree-sitter upgrades to 0.21+ ABI.
    "RUSTSEC-2025-0009",
    # RUSTSEC-2026-0185: quinn-proto 0.11.14 remote memory exhaustion
    # Transitive dependency of the proxy crate (reqwest → hyper-rustls → rustls).
    # The proxy uses HTTP/1.1 + TLS, not QUIC, so the vulnerable stream reassembly
    # code path is never exercised. Upgrading requires rustls >=0.24 which is
    # incompatible with reqwest 0.12. Will resolve when proxy upgrades reqwest.
    "RUSTSEC-2026-0185",
]

# Threshold for reporting vulnerabilities
severity_threshold = "high"
