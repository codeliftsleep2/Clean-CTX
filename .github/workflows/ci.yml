name: CI

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base Git ref for active-file size validation"
        required: true
        default: main
        type: string
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to immutable commit SHAs (supply-chain hardening).
      # Mutable tags can be silently moved to malicious commits.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          # CLI-only workflow/test profile changes must select a fresh dependency cache.
          cache-key: consolidated-${{ hashFiles('.github/workflows/ci.yml', 'scripts/invoke-consolidated-verification.ps1') }}
      - name: cargo check
        run: cargo check --all-targets
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: tree-sitter version consistency check
        shell: pwsh
        run: ./scripts/check-tree-sitter-versions.ps1
      - name: file-size validator behavior tests
        shell: pwsh
        run: ./scripts/tests/check-file-sizes.tests.ps1
      - name: active-file size guard
        shell: pwsh
        env:
          FILE_SIZE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_ref }}
        run: ./scripts/check-file-sizes.ps1 -BaseRef $env:FILE_SIZE_BASE
      - name: UTF-8 / mojibake guard
        shell: pwsh
        run: ./scripts/check-utf8.ps1
      - name: Workspace correctness and deterministic semantic fitness
        id: semantic-fitness
        shell: pwsh
        run: ./scripts/check-semantic-work-fitness.ps1 -Consolidated
      - name: retain semantic fitness evidence
        if: ${{ always() && steps.semantic-fitness.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantic-fitness-${{ github.sha }}-${{ github.run_attempt }}
          path: target/issue-162/af-perf-001-*
          if-no-files-found: warn
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --ignore RUSTSEC-2025-0009

