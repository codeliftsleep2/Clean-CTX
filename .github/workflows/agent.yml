# Agent workflow — GitHub Issue -> Cline Agent -> PR (vertical slice).
#
# Trigger (safest minimal): a collaborator comments `/agent run` on an ISSUE
# (authorization enforced in scripts/agent/agent.mjs). `/agent approve`,
# `/agent abort` and `/agent retry` drive the per-issue state machine.
# `workflow_dispatch` is available for maintainer testing. Nothing starts on
# issue creation or on a label alone.
#
# Security posture:
#   - Least-privilege GITHUB permissions (contents/issues/pull-requests:write).
#   - The runner may only ever push agent/** branches (enforced in code).
#   - Never pushes to the default branch; CI (ci.yml) is the authoritative
#     release-time gate. Branch protection on the default branch is expected.
#   - The LLM key is a repo secret, never logged.
#   - Issue/comment text is untrusted data (see AGENTS.md).

name: agent

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to drive (maintainer testing)."
        required: true
        type: number
      command:
        description: "Agent command (run/approve/abort/retry)."
        required: true
        type: choice
        options:
          - run
          - approve
          - abort
          - retry

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-issue-${{ github.event.issue.number || github.event.inputs.issue }}
  cancel-in-progress: false

env:
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_EVENT_NAME: ${{ github.event_name }}
  ACTOR: ${{ github.actor }}
  GH_TOKEN: ${{ github.token }}
  # Repository secret CLINE_API_KEY -> runner env CLINE_AGENT_API_KEY
  # (the name the runner and its scrub policy expect).
  CLINE_AGENT_API_KEY: ${{ secrets.CLINE_API_KEY }}
  # Multi-account registry: one secret per Cline account (metadata in accounts.json).
  # Only add secrets that actually exist in this repository's Settings > Secrets.
  CLINE_ACCOUNT_01_API_KEY: ${{ secrets.CLINE_ACCOUNT_01_API_KEY }}
  AGENT_BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}

jobs:
  agent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue != null && github.event.issue.pull_request == null)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Pinned to immutable commit SHAs (supply-chain hardening), matching the
      # convention in ci.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name || 'main' }}
          # Explicit ref is required for issue_comment events: github.sha can
          # point to a phantom SHA that doesn't exist as a commit on any ref,
          # causing the checkout to get stale content.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run agent runner
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          HAND_ISSUE: ${{ inputs.issue }}
          HAND_COMMAND: ${{ inputs.command }}
        run: node scripts/agent/agent.mjs