[package]
name = "clean-ctx-proxy"
version = "0.1.0"
edition = "2021"
description = "Anthropic prompt-cache breakpoint proxy for Clean-CTX. Sits between Cline and api.anthropic.com, injecting cache_control on tools/system/messages for ~90% API cost savings."
license = "CC0-1.0"

[[bin]]
name = "clean-ctx-proxy"
path = "src/main.rs"
test = false

[dependencies]
# HTTP server
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful"] }
http-body-util = "0.1"
# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# JSON handling
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async runtime
tokio = { version = "1", features = ["full"] }
# SHA-256 for content hashing (breaker keys)
sha2 = "0.10"
# ANSI regex stripping
regex = "1"
# Binary data handling
bytes = "1"
# Error handling
thiserror = "2"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Formatted hex for hashes
hex = "0.4"
# TOML parsing for filter rules
toml = "0.8"

[dev-dependencies]
tempfile = "3"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful"] }
http-body-util = "0.1"
bytes = "1"
