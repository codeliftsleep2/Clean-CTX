# Clean-CTX built-in filter: pre-commit
# Compact pre-commit output.

[filters.pre-commit]
description = "Compact pre-commit output"
match_command = "^pre-commit\\b"
strip_ansi = true
max_lines = 40

strip_lines_matching = [
  "^\\s*$",
  "^\\[INFO\\]",
  "^\\[WARNING\\]",
]

[[tests.pre-commit]]
name = "clean run"
input = "isort....................................................................Passed\nblack.................................................................Passed\nflake8....................................................................Passed\n"
expected = "isort....................................................................Passed\nblack.................................................................Passed\nflake8....................................................................Passed"

[[tests.pre-commit]]
name = "blank lines stripped"
input = "hook1...Passed\n\nhook2...Passed\n"
expected = "hook1...Passed\nhook2...Passed"