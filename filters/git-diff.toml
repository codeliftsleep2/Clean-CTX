# Clean-CTX built-in filter: git diff/show
# Compact git diff output — keep only functional changes.

[filters.git-diff]
description = "Compact git diff/show output"
match_command = "^git\\s+(diff|show)\\b"
strip_ansi = true
max_lines = 500

strip_lines_matching = [
  "^index [0-9a-f]{7,}",
  "^\\\\ No newline at end of file",
  "^Binary files",
]

keep_lines_matching = [
  "^diff --git",
  "^\\+\\+\\+ ",
  "^--- ",
  "^@@",
  "^\\+",
  "^-",
  "^new file",
  "^deleted file",
  "^rename ",
]

[[tests.git-diff]]
name = "index hashes stripped"
input = """
diff --git a/src/main.rs b/src/main.rs
index abc1234..def5678 100644
--- a/src/main.rs
+++ b/src/main.rs
@@ -1,3 +1,3 @@
 fn main() {
-    println!("hello");
+    println!("world");
 }
\\ No newline at end of file
"""
expected = """diff --git a/src/main.rs b/src/main.rs
--- a/src/main.rs
+++ b/src/main.rs
@@ -1,3 +1,3 @@
 fn main() {
-    println!("hello");
+    println!("world");
 }"""