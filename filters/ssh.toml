# Clean-CTX built-in filter: ssh
# Compact ssh output.

[filters.ssh]
description = "Compact ssh output"
match_command = "^ssh\\b"
strip_ansi = true
max_lines = 200

strip_lines_matching = [
  "^\\s*$",
  "^Last login:",
  "^Welcome to Ubuntu",
  "^System information as of",
  "^\\s+System load:",
  "^\\s+Usage of /",
  "^\\s+Memory usage:",
  "^\\s+Swap usage:",
  "^\\s+Processes:",
  "^\\s+Users logged in:",
  "^\\s+IPv4 address",
  "^\\s+IPv6 address",
  "^\\s+Cloud-init",
]

[[tests.ssh]]
name = "command output kept"
input = "total 48\ndrwxr-xr-x  6 user user 4096 Jan 15 10:00 .\n-rw-r--r--  1 user user  220 Jan 15 09:00 .bashrc\n"
expected = "total 48\ndrwxr-xr-x  6 user user 4096 Jan 15 10:00 .\n-rw-r--r--  1 user user  220 Jan 15 09:00 .bashrc"

[[tests.ssh]]
name = "login banner stripped"
input = "Last login: Mon Jan 15 10:00:00 2024\nWelcome to Ubuntu 22.04 LTS\n\nuser@host:~$ ls\nfile1 file2\n"
expected = "user@host:~$ ls\nfile1 file2"