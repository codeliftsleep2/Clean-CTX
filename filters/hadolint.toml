# Clean-CTX built-in filter: hadolint
# Compact hadolint Dockerfile linting output.

[filters.hadolint]
description = "Compact hadolint output"
match_command = "^hadolint\\b"
strip_ansi = true
max_lines = 40

strip_lines_matching = [
  "^\\s*$",
]

[[tests.hadolint]]
name = "clean check"
input = ""
expected = ""

[[tests.hadolint]]
name = "errors preserved"
input = "Dockerfile:5 DL3007 Using latest is prone to errors in the build. Pin the version explicitly.\nDockerfile:8 DL4006 Set the SHELL option -o pipefail before RUN with a pipe in it.\n"
expected = "Dockerfile:5 DL3007 Using latest is prone to errors in the build. Pin the version explicitly.\nDockerfile:8 DL4006 Set the SHELL option -o pipefail before RUN with a pipe in it."