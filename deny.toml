# cargo-deny configuration

[advisories]
# Path to advisory database
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# If 1 or more advisories are present, fail the build
vulnerability = "deny"
# If 1 or more unmaintained crates are present, fail the build
unmaintained = "deny"
# If 1 or more notice advisories are present, warn
notice = "warn"

# RUSTSEC-2025-0009: ring 0.17.9 AES overflow panic (debug builds only)
# Ignored because upgrading ring >=0.17.12 requires cc ^1.2.8, which
# conflicts with tree-sitter-html 0.20.0 requiring cc ~1.0.83 (ABI-locked).
# Only affects debug builds with overflow checking enabled; release builds
# are unaffected. Will resolve when tree-sitter upgrades to 0.21+ ABI.
ignore = ["RUSTSEC-2025-0009"]

[licenses]
# Deny unknown licenses
unlicensed = "deny"
# Allow these licenses
allow = [
    "MIT",
    "Apache-2.0",
]

[bans]
# Ban unsafe code (currently zero unsafe blocks in the codebase)
deny = []
skip = []

[sources]
# Only allow crates from crates.io by default
allow-registry = ["https://github.com/rust-lang/crates.io-index"]