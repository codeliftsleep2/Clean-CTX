[package]
name = "clean-ctx"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "CC0-1.0"
description = "Token Waste Reducer & Context Compiler - Local-first AST compression engine for LLM token optimization"

[lib]
name = "clean_ctx"
path = "src/lib.rs"

[[bin]]
name = "clean-ctx"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
# SAFETY: tree-sitter 0.20.x is pinned in lockstep with the language crates.
tree-sitter = "=0.20.10"
# SAFETY: Must match tree-sitter 0.20.x ABI.
tree-sitter-c-sharp = "=0.20.0"
# SAFETY: Must match tree-sitter 0.20.x ABI.
tree-sitter-typescript = "=0.20.5"
# SAFETY: Must match tree-sitter 0.20.x ABI.
tree-sitter-html = "=0.20.0"

# high-speed, zero-copy JSON stream parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# High-speed cryptographic hashing
sha2 = "0.10"

# High-speed local token estimation (Closer to standard LLM tokenizers)
tiktoken-rs = "0.11"

# Parallel iteration for workspace compression passes (F-FULL-15)
rayon = "1.10"

[dev-dependencies]
tempfile = "3.27.0"
