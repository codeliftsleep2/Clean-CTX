[workspace]
members = [".", "proxy"]
resolver = "2"

[package]
name = "clean-ctx"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "CC0-1.0"
description = "Token Waste Reducer & Context Compiler - Local-first AST compression engine for LLM token optimization"

[features]
# Default: TypeScript + C# + Angular + .NET (most common full-stack combination).
# Add rust, java for additional language support.
# Add spring_boot for Java framework support.
default = ["typescript", "csharp", "angular", "dotnet"]

# Language layers (each enables a tree-sitter grammar)
typescript = ["dep:tree-sitter-typescript"]
csharp     = ["dep:tree-sitter-c-sharp"]
rust       = ["dep:tree-sitter-rust"]
java       = ["dep:tree-sitter-java"]

# Meta layers (imply their base language)
angular     = ["typescript", "dep:tree-sitter-html"]
spring_boot = ["java"]
dotnet      = ["csharp"]

# Future meta layers (placeholders)
# react      = ["typescript"]
# vue        = ["typescript"]
# ngrx       = ["angular"]
# redux      = ["react"]

[lib]
name = "clean_ctx"
path = "src/lib.rs"

[[bin]]
name = "clean-ctx"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
# SAFETY: tree-sitter versions must be kept in lockstep with the language
# crates' tree-sitter-sys dependency. Run `scripts/check-tree-sitter-versions.ps1`
# in CI to verify ABI alignment. Use `cargo update -p tree-sitter` to bump.
tree-sitter = "0.26"
# SAFETY: Must match tree-sitter ABI via tree-sitter-sys.
# Each grammar is gated by its Cargo feature (typescript, csharp, rust, java, html).
# Building with --no-default-features excludes all grammars.
tree-sitter-c-sharp = { version = "0.23", optional = true }
# SAFETY: Must match tree-sitter ABI via tree-sitter-sys.
tree-sitter-typescript = { version = "0.23", optional = true }
# SAFETY: Must match tree-sitter ABI via tree-sitter-sys.
tree-sitter-html = { version = "0.23", optional = true }
# SAFETY: Must match tree-sitter ABI via tree-sitter-sys.
tree-sitter-rust = { version = "0.24", optional = true }
# SAFETY: Must match tree-sitter ABI via tree-sitter-sys.
tree-sitter-java = { version = "0.23", optional = true }
# Streaming iterator trait used by tree-sitter QueryMatches API
streaming-iterator = "0.1"

# high-speed, zero-copy JSON stream parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# High-speed cryptographic hashing
sha2 = "0.10"

# High-speed local token estimation (Closer to standard LLM tokenizers)
tiktoken-rs = "0.12"

# Parallel iteration for workspace compression passes (F-FULL-15)
rayon = "1.10"

# Streaming directory walker for F-19 (replaces recursive collect-then-sort)
walkdir = "2.5"

# Lock-free work queue for A-PRODUCTION dispatcher
crossbeam-channel = "0.5"

# Structured logging for observability (A-PRODUCTION, A-04)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# SQLite persistence layer for cross-session context survival
rusqlite = { version = "0.32", features = ["bundled"] }
# Base64 encoding for fallback file serialization
base64 = "0.22"
# Concurrent hashmap for TTL-based graph caching (CBM Phase 1)
dashmap = "6.1"
# High-resolution timestamps for persistence metadata
chrono = { version = "0.4", features = ["serde"] }

# Derive macro for structured error types
thiserror = "2"

# Synchronous HTTP client for proxy stats endpoint (Phase 2)
ureq = { version = "3", features = ["json"] }

# Constructor attribute for eager static initialization (prevents OnceLock contention in parallel tests)
ctor = "0.2"

# Ctrl+C handler for the `clean-ctx proxy` standalone subcommand
ctrlc = "3.4"

[dev-dependencies]
tempfile = "3.27.0"
serial_test = "3.2"
proptest = "1.6"
